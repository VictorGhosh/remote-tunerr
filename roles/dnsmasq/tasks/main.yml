---
- name: Install dnsmasq
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure DHCP for the tuner LAN
  ansible.builtin.template:
    src: tuner-lan.conf.j2
    dest: /etc/dnsmasq.d/tuner-lan.conf
    owner: root
    group: root
    mode: "0644"
    validate: dnsmasq --test --conf-file=%s
  notify: Restart dnsmasq

- name: Keep dnsmasq running and enable at boot
  ansible.builtin.service:
    name: dnsmasq
    state: started
    enabled: true
